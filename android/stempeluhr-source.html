<style>
/* Layout: one-screen phone app, scrolling content, fixed bottom tab bar, bottom sheets for editing */
:root {
  --bg: #F2F4F1;
  --surface: #FFFFFF;
  --surface-2: #E8ECE7;
  --ink: #15201B;
  --muted: #5B6862;
  --line: #D4DAD3;
  --accent: #0E6B57;

  --accent-soft: #D6EBE3;
  --break: #A86200;
  --break-soft: #F6E6C9;
  --danger: #B3261E;
  --danger-soft: #F8DEDA;
  --blue: #2B5BA6;
  --blue-soft: #DCE6F6;
  --violet: #6A4BA8;
  --violet-soft: #E7E0F5;
  --shadow: 0 1px 2px rgba(20,32,27,.06), 0 6px 20px rgba(20,32,27,.06);
  --f-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1412; --surface: #172019; --surface-2: #212C27; --ink: #E6ECE8; --muted: #9AA7A0; --line: #2D3934;
    --accent: #4FC3A1; --accent-ink: #062219; --accent-soft: #163A30;
    --break: #E9A949; --break-soft: #3A2B12; --danger: #F2877E; --danger-soft: #3E1D1A;
    --blue: #8DB2F0; --blue-soft: #1D2C45; --violet: #B9A2EC; --violet-soft: #2C2343;
    --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1412; --surface: #172019; --surface-2: #212C27; --ink: #E6ECE8; --muted: #9AA7A0; --line: #2D3934;
  --accent: #4FC3A1; --accent-ink: #062219; --accent-soft: #163A30;
  --break: #E9A949; --break-soft: #3A2B12; --danger: #F2877E; --danger-soft: #3E1D1A;
  --blue: #8DB2F0; --blue-soft: #1D2C45; --violet: #B9A2EC; --violet-soft: #2C2343;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

.app { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 4px 14px; }

.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

/* Heute */
.clock-card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px 16px 16px; box-shadow: var(--shadow); display: grid; gap: 14px; }

.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

.stamp-betr.set { border-color: var(--accent); background: var(--accent-soft); }
.stamp-betr.run { border-color: var(--blue); background: var(--blue-soft); }
.stamp-betr.run span, .stamp-betr.run b { color: var(--blue); }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; min-width: 0; }
.tile span { display: block; font-size: 12px; color: var(--muted); }
.tile b { display: block; font-family: var(--f-num); font-size: 22px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.tile small { color: var(--muted); font-size: 12px; }
.pos { color: var(--accent); }

.note { border-radius: 12px; padding: 10px 12px; font-size: 13.5px; background: var(--break-soft); color: var(--ink); border: 1px solid var(--break); }
.note.info { background: var(--blue-soft); border-color: var(--blue); }
.hint { font-size: 13px; color: var(--muted); margin: 0; }

.quick { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
.quick button { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 6px; display: grid; justify-items: center; gap: 6px; font-size: 13px; font-weight: 600; min-height: 76px; }
.quick button svg { color: var(--accent); }

/* Chips */
.chip { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--muted); }

.chip.k-violet { background: var(--violet-soft); color: var(--violet); }

/* Monat */
.month-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.month-nav h2 { margin: 0; font-size: 20px; text-transform: none; letter-spacing: 0; color: var(--ink); }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.days { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.day { display: grid; grid-template-columns: 46px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.day:last-child { border-bottom: 0; }
.day.weekend { background: var(--bg); }
.day.today { box-shadow: inset 3px 0 0 var(--accent); }
.day .d { font-weight: 700; line-height: 1.1; }
.day .d small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.day .mid { min-width: 0; display: grid; gap: 3px; }
.day .times { font-family: var(--f-num); font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.day .right { text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.day .right b { display: block; font-size: 15px; }
.day .right small { font-size: 12px; }
.future { opacity: .62; }

/* Forms */
.field { display: grid; gap: 5px; }
.field label, .lbl { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; min-height: 46px; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 12px; font-size: 16px; }
.field textarea { min-height: 70px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.grid4 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.field input, .field select { min-width: 0; }
.week-soll { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 4px; }
.week-soll .field input { padding: 8px 2px; font-size: 13px; text-align: center; min-height: 42px; }
.week-soll .field label { text-align: center; }
.wt-day { justify-items: center; align-items: center; gap: 4px; font-size: 13px; }
.wt-day input { width: 22px; height: 22px; min-height: 0; accent-color: var(--accent, #2563eb); }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 500; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.form { display: grid; gap: 12px; }
.err { color: var(--danger); font-size: 13.5px; font-weight: 600; }
.abs-row { display: grid; grid-template-columns: minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) 40px; gap: 6px; align-items: end; }
.abs-row .field select, .abs-row .field input { padding: 8px 6px; font-size: 14px; }
.abs-row .icon-btn { width: 40px; height: 46px; }
.earn-out { display: grid; gap: 2px; margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--bg); }
.earn-out span { color: var(--muted); font-size: 13.5px; }
.earn-out b { font-size: 26px; letter-spacing: -.01em; }
.earn-out small { color: var(--muted); font-size: 12.5px; }
.closed-badge { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--accent); margin: -4px 0 10px; }
.closed-badge svg { width: 16px; height: 16px; }
.closed-card { border-color: var(--accent); }
.ytbl { display: grid; }
.ytr { display: grid; grid-template-columns: minmax(0,1.4fr) 0.6fr 1fr 1fr; gap: 6px; align-items: center; padding: 10px 2px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; font: inherit; color: inherit; width: 100%; }
.ytr:last-child { border-bottom: 0; }
.ytr span:not(:first-child) { text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.ytr .ok svg { width: 14px; height: 14px; color: var(--accent); vertical-align: -2px; }
.yth { font-size: 12px; font-weight: 600; color: var(--muted); padding-top: 0; }
.kp-row { display: flex; gap: 8px; margin-top: 10px; }
.std-form { display: grid; gap: 6px; margin-top: 14px; }
.std-form label { font-weight: 600; }
.std-row { display: flex; gap: 8px; }
.std-row input { flex: 1; width: 0; min-width: 0; font-size: 22px; font-weight: 600; text-align: center; padding: 12px; border-radius: 12px; border: 1.5px solid var(--line, #ccc); background: var(--surface); color: var(--ink, inherit); }
.std-form small { color: var(--muted); }
.fn-list { display: grid; gap: 0; }
.fn-list .check { min-height: 40px; font-size: 14.5px; }
.kp-btn { background: var(--break-soft); border-color: var(--break); }
.kp-erow { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) 44px; gap: 8px; align-items: end; }
.kp-erow .icon-btn { width: 44px; height: 46px; }
.kd-open { cursor: pointer; min-width: 0; }
.knr { display: inline-block; font-family: var(--f-num); font-size: 12px; font-weight: 600; padding: 1px 6px; border-radius: 6px; background: var(--blue-soft); color: var(--blue); vertical-align: 1px; }
.ks-row { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; font: inherit; color: inherit; }
.ks-row svg { color: var(--muted); width: 18px; }
.mat { margin-top: 4px; font-size: 13px; color: var(--break); font-weight: 600; }
.kd-acts { display: flex; gap: 6px; align-items: center; }
#print-root { position: fixed; inset: 0; z-index: 60; overflow: auto; background: var(--bg); padding: 12px 12px 40px; }
.pr-bar { position: sticky; top: 0; display: flex; gap: 8px; padding: 8px 0; background: var(--bg); z-index: 1; }
.pr-hint { font-size: 13px; color: var(--muted); margin: 0 0 10px; }

.pr-page { background: #fff; color: #111; border-radius: 8px; padding: 14px; overflow-x: auto; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
body.printing { overflow: hidden; }
@media print {
  @page { size: A4 portrait; margin: 10mm 9mm; }
  body.printing > *:not(#print-root) { display: none !important; }
  html, body.printing { background: #fff !important; }
  body.printing #print-root { position: static; overflow: visible; padding: 0; background: #fff; }
  body.printing .pr-bar, body.printing .pr-hint { display: none !important; }
  body.printing .pr-page { box-shadow: none; padding: 0; border-radius: 0; overflow: visible; }
}
.kd-tbl { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); }
.kd-cap { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 8px 8px 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
.kd-cap b { font-size: 14px; }
.kd-cap small { color: var(--muted); font-size: 12.5px; font-weight: 500; margin-left: 6px; }
.kd-plus { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; font-size: 26px; line-height: 1; display: grid; place-items: center; font-weight: 500; }
.kd-tr { display: grid; grid-template-columns: minmax(0,1fr) 72px 72px 32px; gap: 4px; align-items: center; padding: 5px 6px; border-bottom: 1px solid var(--line); }
.kd-tr:last-child { border-bottom: 0; }
.kd-tr .kd-note { grid-column: 1 / -1; min-height: 38px; font-size: 14px; }
.kd-th { font-size: 12px; font-weight: 600; color: var(--muted); padding-top: 6px; padding-bottom: 6px; }
.kd-th span { padding-left: 4px; }
.kd-tr input { width: 100%; min-width: 0; min-height: 42px; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 6px 6px; font-size: 15px; }
.kd-tr input[type=time] { padding: 6px 2px; text-align: center; }
.kd-tr input[type=time]::-webkit-calendar-picker-indicator { display: none; }
.no-picker .kd-tr input[type=time]::-webkit-calendar-picker-indicator { display: block; }
.kd-tr .icon-btn { width: 32px; height: 42px; border-radius: 10px; }
.kd-empty { padding: 12px; color: var(--muted); font-size: 13.5px; }

.list { display: grid; }
.li { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: 0; }
.li small { color: var(--muted); display: block; font-size: 12.5px; }

.kv { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 6px 12px; font-size: 14.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; font-weight: 600; }

/* Nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.nav-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); }
.nav button { border: 0; background: none; display: grid; justify-items: center; align-content: center; gap: 3px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.nav button[aria-current="page"] { color: var(--accent); }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(8,14,12,.45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 8px max(16px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.sheet .grab { width: 40px; height: 5px; background: var(--line); border-radius: 3px; margin: 4px auto 12px; }
.sheet h3 { margin: 0 0 4px; font-size: 19px; }
.sheet .sub { color: var(--muted); margin: 0 0 14px; font-size: 13.5px; }
.sheet-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.sheet textarea.out { width: 100%; min-height: 200px; font-family: var(--f-num); font-size: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); padding: 10px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 500; width: min(520px, calc(100% - 32px)); box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.toast button { margin-left: auto; border: 0; background: transparent; color: var(--accent-soft); font-weight: 700; padding: 8px 10px; }
.toast span { flex: 1; min-width: 0; }

.empty { text-align: center; padding: 20px 8px; color: var(--muted); font-size: 14px; }
</style>

<script>
(() => {
"use strict";

/* ---------- Stammdaten ---------- */
const KINDS = {

  urlaub:      { label: "Urlaub", credit: "soll", cls: "k-blue", vac: 1 },

};

};
const ORTE = { betrieb: "Betrieb", homeoffice: "Homeoffice", dienstreise: "Dienstreise", aussendienst: "Außendienst / Baustelle", kunde: "Beim Kunden" };
const WD = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
const WD_LONG = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];

/* ---------- Helfer ---------- */
const pad = n => String(n).padStart(2, "0");
const dsOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDs = ds => { const [y, m, d] = ds.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (ds, n) => { const d = parseDs(ds); d.setDate(d.getDate() + n); return dsOf(d); };
const todayDs = () => dsOf(new Date());
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const toMin = hm => { if (!hm) return null; const [h, m] = hm.split(":").map(Number); return h * 60 + m; };

const hm = m => { const s = m < 0 ? "−" : ""; m = Math.abs(Math.round(m)); return `${s}${Math.floor(m / 60)}:${pad(m % 60)}`; };

const dec2 = v => v.toFixed(2).replace(".", ",");

/* ---------- Feiertage ---------- */
function easter(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),

}

  const E = easter(y), map = {};
  const fix = (md, n) => map[`${y}-${md}`] = n, rel = (off, n) => map[addDays(E, off)] = n;
  if (region === "AT") {
    fix("01-01", "Neujahr"); fix("01-06", "Heilige Drei Könige"); rel(1, "Ostermontag"); fix("05-01", "Staatsfeiertag");
    rel(39, "Christi Himmelfahrt"); rel(50, "Pfingstmontag"); rel(60, "Fronleichnam"); fix("08-15", "Mariä Himmelfahrt");
    fix("10-26", "Nationalfeiertag"); fix("11-01", "Allerheiligen"); fix("12-08", "Mariä Empfängnis");
    fix("12-25", "Christtag"); fix("12-26", "Stefanitag");
  } else if (region === "DE") {
    fix("01-01", "Neujahr"); rel(-2, "Karfreitag"); rel(1, "Ostermontag"); fix("05-01", "Tag der Arbeit");
    rel(39, "Christi Himmelfahrt"); rel(50, "Pfingstmontag"); fix("10-03", "Tag der Deutschen Einheit");
    fix("12-25", "1. Weihnachtstag"); fix("12-26", "2. Weihnachtstag");
  }

}
const holidayName = ds => holidays(+ds.slice(0, 4), S.settings.region)[ds] || null;

/* ---------- Zustand & Speicherung ---------- */
const LS_KEY = "stempeluhr.v1";
const defaultSettings = () => ({
  name: "", persnr: "", firma: "", region: "AT",
  soll: [480, 480, 480, 480, 390, 0, 0], // Mo..So in Minuten
  erfassung: "zeit", // "stunden": nur Gesamtstunden pro Tag

try {

  if (raw) { const p = JSON.parse(raw); S.settings = { ...defaultSettings(), ...(p.settings || {}) }; S.months = p.months || {}; }
} catch (e) { /* kein lokaler Speicher */ }

function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} }

let dbCol = null, syncMode = "pending";
const pending = new Set();
let flushTimer = null, writing = false;
function scheduleRemote(id) { pending.add(id); clearTimeout(flushTimer); flushTimer = setTimeout(flush, 600); }

  if (!dbCol || writing) return;

    while (pending.size) {

      pending.delete(id);
      const body = id === "settings" ? clone(S.settings) : clone(S.months[id.slice(2)] || { days: {}, updatedAt: Date.now() });

  } finally { writing = false; }
}

function getRec(ds) { const m = S.months[ds.slice(0, 7)]; return m && m.days[ds.slice(8)] || null; }
function setRec(ds, rec) {
  const mk = ds.slice(0, 7);
  if (!S.months[mk]) S.months[mk] = { days: {}, updatedAt: 0 };
  if (rec) S.months[mk].days[ds.slice(8)] = rec; else delete S.months[mk].days[ds.slice(8)];
  refreshClosed(mk);
  S.months[mk].updatedAt = Date.now();
  saveLocal(); scheduleRemote("m-" + mk);
}
function saveSettings() { S.settings.updatedAt = Date.now(); saveLocal(); scheduleRemote("settings"); }

/* ---------- Monatsabschluss ---------- */
// Am Monatsersten wird der Vormonat abgeschlossen: die Ergebnisse werden als fester Stand im Monat gespeichert.
// Die Tageseinträge bleiben erhalten; wird danach noch etwas geändert, wird der Stand aktualisiert und markiert.
function monthSnapshot(mk) {
  const t = monthStats(mk), e = earn(t);
  return { soll: t.soll, ist: t.ist, saldo: t.saldo, worked: t.worked, workdays: t.workdays, urlaub: t.urlaub, krank: t.krank, arzt: t.arzt, km: t.km,
    konto: totalSaldo(lastDayOf(mk)), kunden: customerStats(mk), verdienst: e.rate ? { basis: e.basis, rate: e.rate, sum: e.sum } : null };
}
function closeMonths() {
  const cur = todayDs().slice(0, 7); let last = null;
  for (const mk of allMonthKeys()) {
    if (mk >= cur) continue;
    const m = S.months[mk];
    if (m && m.closed) continue;
    if (!m || !Object.keys(m.days || {}).length) { if (mk >= S.settings.startDate.slice(0, 7) && monthStats(mk).soll === 0) continue; }
    if (!S.months[mk]) S.months[mk] = { days: {}, updatedAt: 0 };
    S.months[mk].closed = { at: Date.now(), ...monthSnapshot(mk) };
    S.months[mk].updatedAt = Date.now(); scheduleRemote("m-" + mk); last = mk;
  }

  saveLocal();
}
function refreshClosed(mk) {
  const m = S.months[mk];
  if (m && m.closed) m.closed = { ...m.closed, ...monthSnapshot(mk), changedAt: Date.now() };
}

function setSync(mode) {
  syncMode = mode;
  const el = $("sync");
  el.className = "sync " + mode;
  el.querySelector("span").textContent = mode === "cloud" ? "In deinem Konto gesichert" : mode === "device" ? "Auf diesem Handy gespeichert" : mode === "local" ? "Nur auf diesem Gerät" : "Verbinde …";
}

async function connect() {
  if (window.AndroidBridge || window.STEMPELUHR_OFFLINE) { setSync("device"); try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {} return render(); }
  let tries = 0;
  while (!(window.claude && window.claude.use) && tries < 10) { await new Promise(r => setTimeout(r, 300)); tries++; }
  if (!(window.claude && window.claude.use)) return setSync("local");
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return setSync("local");
    const uid = await user.id();
    if (!uid) return setSync("local");
    dbCol = db.collection("data/users/" + uid);
    let pushed = false;
    dbCol.onSnapshot(snap => {
      let changed = false;
      const remote = new Map();
      for (const d of snap.docs) {
        const data = d.data() || {};
        remote.set(d.id, data.updatedAt || 0);
        if (d.id === "settings") {
          if ((data.updatedAt || 0) > (S.settings.updatedAt || 0)) { S.settings = { ...defaultSettings(), ...clone(data) }; changed = true; }
        } else if (d.id.startsWith("m-")) {
          const mk = d.id.slice(2), loc = S.months[mk];
          if (!loc || (data.updatedAt || 0) > (loc.updatedAt || 0)) { S.months[mk] = { days: clone(data.days || {}), updatedAt: data.updatedAt || 0 }; changed = true; }
        }
      }
      if (!pushed && !snap.metadata.fromCache) {
        pushed = true;
        for (const mk in S.months) if ((S.months[mk].updatedAt || 0) > (remote.has("m-" + mk) ? remote.get("m-" + mk) : -1)) scheduleRemote("m-" + mk);
        if ((S.settings.updatedAt || 0) > (remote.has("settings") ? remote.get("settings") : -1)) scheduleRemote("settings");
      }
      setSync("cloud");
      if (!closedOnce) { closedOnce = true; closeMonths(); changed = true; }
      if (changed) { saveLocal(); render(); }
    }, () => { dbCol = null; setSync("local"); });
  } catch (e) { setSync("local"); }
}

/* ---------- Kunden ---------- */
const kdDur = k => (k.from && k.to) ? ((toMin(k.to) - toMin(k.from)) + 1440) % 1440 : 0;
const kdMin = (k, ds) => k.to ? kdDur(k) : (ds === todayDs() && k.from ? Math.max(0, nowMin() - toMin(k.from)) : 0);
// „Betrieb“ ist ein Einsatz wie ein Kunde (Von–Bis), zählt aber nicht als Kundschaft
const BETRIEB = "Betrieb";
const isBetr = k => String(k.name || "").trim().toLowerCase() === "betrieb";
const betrMin = (r, ds) => ((r && r.kunden) || []).filter(isBetr).reduce((a, k) => a + kdMin(k, ds), 0);
/* Kundenstamm: die Kundennummer ist der feste Schlüssel, der Name darf sich ändern.
   S.settings.kstamm = { "<nr>": { nr, name, alt: [frühere Namen], at } }; Einsätze speichern { name, nr }. */
const kstamm = () => S.settings.kstamm || {};
const normName = n => String(n || "").trim().toLowerCase().replace(/\s+/g, " ");
const kLabel = k => k.nr ? `${k.nr} · ${k.name}` : k.name;
function findByName(name) {
  const n = normName(name); if (!n) return null;
  for (const e of Object.values(kstamm())) if (normName(e.name) === n) return e;
  for (const e of Object.values(kstamm())) if ((e.alt || []).some(a => normName(a) === n)) return e;
  return null;
}
// Eingabe „1234“, „1234 · Name“, „1234 Name“ oder nur „Name“ → { nr, name, typedNr }
function resolveKunde(input) {
  const raw = String(input || "").trim(); if (!raw) return { name: "" };
  if (normName(raw) === "betrieb") return { name: BETRIEB };
  const m = raw.match(/^#?(\d{1,10})(?:\s*[·\-–:;,|\/]\s*|\s+)?(.*)$/);
  if (m) {
    const nr = m[1], nm = m[2].trim(), e = kstamm()[nr];
    return { nr, name: nm || (e ? e.name : ""), typedNr: true };
  }

}
// Neue Nummer oder neuer Name aus einer Eingabe in den Kundenstamm übernehmen
function learnKunde(rk) {
  if (!rk.nr || !rk.name || !rk.typedNr) return false;
  const st = { ...kstamm() }, e = st[rk.nr];
  if (!e) st[rk.nr] = { nr: rk.nr, name: rk.name, alt: [], at: Date.now() };
  else if (normName(e.name) !== normName(rk.name)) st[rk.nr] = { ...e, name: rk.name, alt: [...new Set([...(e.alt || []), e.name])].filter(a => normName(a) !== normName(rk.name)), at: Date.now() };
  else return false;
  S.settings.kstamm = st; saveSettings(); return true;
}
// Alte Einsätze ohne Nummer per Name (oder früherem Namen) zuordnen
function assignNumbers() {
  let n = 0;
  for (const mk in S.months) {
    let ch = false;
    for (const dd in S.months[mk].days) for (const k of S.months[mk].days[dd].kunden || []) {
      if (k.nr || isBetr(k)) continue;
      const e = findByName(k.name); if (e) { k.nr = e.nr; ch = true; n++; }
    }
    if (ch) { S.months[mk].updatedAt = Date.now(); scheduleRemote("m-" + mk); }
  }
  if (n) saveLocal();
  return n;
}
const kKey = k => k.nr ? "#" + k.nr : normName(k.name);
const kCurName = k => (k.nr && kstamm()[k.nr]) ? kstamm()[k.nr].name : k.name;
function knownCustomers() {
  const m = new Map();
  for (const e of Object.values(kstamm())) m.set("#" + e.nr, { label: `${e.nr} · ${e.name}`, n: 0 });
  for (const mk in S.months) for (const dd in S.months[mk].days) for (const k of S.months[mk].days[dd].kunden || []) {
    if (!k.name || isBetr(k)) continue;
    const key = kKey(k), x = m.get(key) || { label: kLabel({ nr: k.nr, name: kCurName(k) }), n: 0 }; x.n++; m.set(key, x);
  }

}
function customerStats(mk) {
  const m = new Map();
  for (const ds of monthDays(mk)) {
    const r = getRec(ds);
    for (const k of ((r && r.kunden) || []).filter(k => !isBetr(k))) {
      const key = kKey(k), e = m.get(key) || { key, nr: k.nr || "", name: kCurName(k), min: 0, n: 0 };
      e.label = kLabel(e); e.min += kdMin(k, ds); e.n++; m.set(key, e);
    }
  }
  return [...m.values()].sort((a, b) => b.min - a.min);
}
const kdDatalist = () => `<datalist id="kd-list">${knownCustomers().map(n => `<option value="${esc(n)}"></option>`).join("")}</datalist>`;

const eur = v => v.toLocaleString("de-AT", { style: "currency", currency: "EUR" });
const EARN_BASIS = { worked: "Gearbeitet", ist: "Mit Urlaub/Krank", ueber: "Überstunden", krank: "Krankenstand" };
const EARN_HINT = { worked: "gestempelte Arbeitszeit", ist: "Ist-Stunden inkl. Urlaub, Krankenstand, Feiertag", ueber: "Überstunden = Ist minus Soll im Monat", krank: "Stunden der Krankenstandstage" };
const earnBasis = () => EARN_BASIS[S.settings.rateBasis] ? S.settings.rateBasis : "worked";
// eigener Stundensatz je Auswahl (z. B. Überstunden mit Zuschlag); alter Einzelwert gilt als Vorgabe
const rateStr = b => { const r = S.settings.rates || {}; return r[b] != null ? r[b] : (S.settings.rate || ""); };
const rateNum = b => { const v = parseFloat(String(rateStr(b)).replace(",", ".")); return isFinite(v) && v > 0 ? v : 0; };
function earn(t) {
  const basis = earnBasis(), rate = rateNum(basis);
  const min = Math.max(0, { worked: t.worked, ist: t.ist, ueber: t.saldo, krank: t.krankMin }[basis]);
  return { basis, min, rate, sum: Math.round(min / 60 * rate * 100) / 100 };
}
const earnLine = e => `${EARN_BASIS[e.basis]} ${dec(e.min)} h × ${eur(e.rate)} = ${eur(e.sum)}`;
const kpDefault = () => Math.max(1, Math.min(120, Math.round(Number(S.settings.kpMin) || 10)));
const kpSum = r => (r.kp || []).reduce((a, k) => a + (Number(k.min) || 0), 0);
/* ---------- Berechnung ---------- */
function sollBase(ds) {
  if (holidayName(ds)) return 0;
  const wd = (parseDs(ds).getDay() + 6) % 7;
  return sollWoche()[wd] || 0;
}
const isFlex = () => S.settings.modell === "woche";
const nurStd = () => S.settings.erfassung === "stunden";
/* Funktionen im Profil ein-/ausblendbar (Standard: alles an). Ausblenden löscht keine Daten. */
const FUNKTIONEN = { mittag: "Mittagspause stempeln", kaffee: "Kaffeepause", betrieb: "Betrieb einstempeln", kunden: "Kunden", km: "Kilometer", projekt: "Projekt / Kostenstelle", verdienst: "Verdienst im Monat" };
const on = k => (S.settings.zeigen || {})[k] !== false;
/* "8", "7,5", "7.25", "7:30" → Minuten (null wenn ungültig) */
function parseStd(v) {
  if (typeof v === "number") return v >= 0 && v <= 1440 ? Math.round(v) : null;
  const t = String(v || "").trim(); let m;
  if ((m = t.match(/^(\d{1,2}):(\d{2})$/)) && Number(m[2]) < 60) { const x = Number(m[1]) * 60 + Number(m[2]); return x <= 1440 ? x : null; }
  if ((m = t.match(/^(\d{1,2})(?:[,.](\d{1,2}))?$/))) { const x = Math.round(parseFloat(m[1] + "." + (m[2] || 0)) * 60); return x <= 1440 ? x : null; }
  return null;

function absenceGroups(year) {
  const items = [];
  for (const mk of Object.keys(S.months).sort()) {
    if (!mk.startsWith(year + "-")) continue;
    for (const dd of Object.keys(S.months[mk].days).sort()) {
      const rec = S.months[mk].days[dd];
      if (rec.kind && rec.kind !== "arbeit") items.push({ ds: `${mk}-${dd}`, kind: rec.kind });
    }
  }
  const groups = [];
  for (const it of items) {
    const g = groups[groups.length - 1];
    if (g && g.kind === it.kind && dayGapFree(g.to, it.ds)) { g.to = it.ds; g.days.push(it.ds); }
    else groups.push({ kind: it.kind, from: it.ds, to: it.ds, days: [it.ds] });
  }
  return groups.reverse();
}

function readDraftInputs() {

function validateRec(r) {
  const t = k => toMin(r[k]);

  if (r.std != null && r.in) return "Bitte entweder Uhrzeiten oder Gesamtstunden eintragen, nicht beides.";
  if ((r.ls || r.le || r.out) && !r.in) return "Bitte zuerst den Arbeitsbeginn eintragen.";
  if (r.le && !r.ls) return "Mittag Ende braucht auch einen Mittag Anfang.";
  if (r.ls && t("ls") < t("in")) return "Mittag Anfang liegt vor dem Arbeitsbeginn.";
  if (r.le && t("le") < t("ls")) return "Mittag Ende liegt vor dem Mittag Anfang.";
  if (r.out && r.le && t("out") < t("le") && t("out") > t("in")) return "Arbeitsende liegt vor dem Mittag Ende.";
  for (const k of r.kunden || []) {
    if (!k.name || !k.from) return "Bitte bei jedem Kunden Name und Von eintragen.";

  }
  for (const k of r.kp || []) if (!(k.min >= 1 && k.min <= 120)) return "Bitte bei jeder Kaffeepause 1 bis 120 Minuten eintragen.";
  for (const a of r.abs || []) if (!a.from || !a.to || toMin(a.to) <= toMin(a.from)) return "Bitte bei jeder Abwesenheit Von und Bis eintragen (Bis nach Von).";

}

    if (k === "kp") { const ks = v.map(x => ({ at: x.at || "", min: Math.round(Number(x.min)) })).filter(x => x.min > 0).sort((a, b) => a.at.localeCompare(b.at)); if (ks.length) out.kp = ks; continue; }

function parseKundenListe(text) {

async function offerFile(filename, data) {
  const bin = data instanceof Uint8Array;
  const mime = filename.endsWith(".png") ? "image/png" : filename.endsWith(".xlsx") ? "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" : filename.endsWith(".csv") ? "text/csv" : filename.endsWith(".html") ? "text/html" : "application/json";
  if (window.AndroidBridge) { if (bin) { toast("Excel-Datei geht in dieser App-Version nicht. Bitte die Web-App verwenden."); return; } AndroidBridge.saveFile(filename, mime, data); return; }
  if (window.STEMPELUHR_OFFLINE) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], { type: bin ? mime : mime + ";charset=utf-8" }));
    a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    toast("Datei wird in Downloads gespeichert."); return;
  }
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) {}
  if (dl) {
    try { await dl.save({ filename, data }); toast("Datei gespeichert."); return; }
    catch (e) { if (e && e.code === "declined") return; if (e && e.code === "rate_limited") { toast("Bitte kurz warten und nochmal tippen."); return; } }
  }
  if (bin) { toast("Herunterladen ist hier nicht möglich."); return; }
  showText(filename, data.replace(/^﻿/, ""), "Herunterladen ist hier nicht möglich. Kopiere den Inhalt und füge ihn in Excel oder eine E-Mail ein.");
}

document.addEventListener("submit", e => {

    const ds = todayDs(), txt = $("h-std").value.trim(), m = parseStd(txt), errEl = $("h-err");

    if (txt && m == null) { errEl.textContent = "Bitte als Zahl eintragen, z. B. 8, 7,5 oder 7:30 (höchstens 24)."; errEl.hidden = false; return; }
    if (m == null) delete rec.std; else { rec.std = m; if (rec.kind !== "arbeit" && !rec.in) rec.kind = "arbeit"; }
    setRec(ds, isEmptyRec(rec, ds) ? null : rec); lastUndo = { ds, prev: prev ? clone(prev) : null };
    toast(m == null ? "Stunden entfernt." : `${hm(m)} h für heute gespeichert.`, true); render(); return;
  }
  if (f.id === "edit-form") {
    readDraftInputs();
    const r = cleanRec(draft.rec), err = validateRec(r);
    if (err) { renderEditor(err); return; }
    const ds = draft.ds;
    setRec(ds, isEmptyRec(r, ds) ? null : r);
    closeSheet(); toast("Gespeichert."); render();

    const rk = resolveKunde($("k-name").value), mode = f.dataset.mode, ds = $("k-date").value, name = rk.name, from = $("k-from").value, to = mode === "add" ? $("k-to").value : "", errEl = $("k-err");
    const fail = m => { errEl.textContent = m; errEl.hidden = false; };
    if (!name) return fail(rk.nr ? `Kundennummer ${rk.nr} ist noch nicht im Kundenstamm. Bitte „${rk.nr} Name“ eintragen.` : "Bitte Nummer oder Name des Kunden eintragen.");
    if (!ds || !from) return fail("Bitte Datum und Von-Zeit eintragen.");
    if (mode === "add" && (!to || to === from)) return fail("Bitte eine Bis-Zeit eintragen, die sich von der Von-Zeit unterscheidet.");
    const r = clone(getRec(ds) || { kind: holidayName(ds) ? "feiertag" : "arbeit" });
    learnKunde(rk);
    const k = { name, from }; if (rk.nr) k.nr = rk.nr; if (to) k.to = to; const note = $("k-note").value.trim(); if (note) k.note = note;
    // Beim Start endet ein laufender Einsatz (z. B. Betrieb) zur Ankunftszeit
    if (mode === "start") for (const x of r.kunden || []) if (x.from && !x.to) x.to = toMin(from) > toMin(x.from) ? from : pad(Math.floor(((toMin(x.from) + 1) % 1440) / 60)) + ":" + pad((toMin(x.from) + 1) % 60);

    setRec(ds, r); closeSheet();
    toast(mode === "start" ? `${name} ab ${from} gestartet` : `${name} ${from}–${to} eingetragen`, true); render();
  } else if (f.id === "kdnote-form") {
    const ds = todayDs(), prev = getRec(ds), r = clone(prev || {}), k = (r.kunden || [])[+f.dataset.i];
    if (!k) { closeSheet(); return; }
    const rk = resolveKunde($("kn-name").value), name = rk.name, from = $("kn-from").value, to = $("kn-to").value, err = $("kn-err");
    const fail = m => { err.textContent = m; err.hidden = false; };
    if (!name) return fail(rk.nr ? `Kundennummer ${rk.nr} ist noch nicht im Kundenstamm. Bitte „${rk.nr} Name“ eintragen.` : "Bitte Nummer oder Name des Kunden eintragen.");
    if (!from) return fail("Bitte eine Von-Zeit eintragen.");
    if (to && to === from) return fail("Von und Bis sind gleich.");
    if (!to && r.kunden.some((x, j) => j !== +f.dataset.i && x.from && !x.to)) return fail("Es läuft schon ein anderer Kunde. Bitte eine Bis-Zeit eintragen.");
    learnKunde(rk);
    k.name = name; if (rk.nr) k.nr = rk.nr; else delete k.nr; k.from = from; if (to) k.to = to; else delete k.to;
    const note = $("kn-text").value.trim(); if (note) k.note = note; else delete k.note;
    r.kunden.sort((a, b) => a.from.localeCompare(b.from));
    lastUndo = { ds, prev: clone(prev) };
    setRec(ds, r);
    const mat = $("kn-mat").value.split("\n").map(x => x.trim()).filter(Boolean).join("\n");
    if (mat !== matOf(kLabel(k))) setMat(kLabel(k), mat);
    closeSheet(); toast(`${name} gespeichert`, true); render();
  } else if (f.id === "ks-form") {
    const nr = $("ks-nr").value.trim().replace(/^#/, ""), name = $("ks-name").value.trim(), old = f.dataset.old, err = $("ks-err");
    const fail = m => { err.textContent = m; err.hidden = false; };
    if (!/^\d{1,10}$/.test(nr)) return fail("Die Kundennummer darf nur Ziffern enthalten.");
    if (!name) return fail("Bitte einen Namen eintragen.");
    if (nr !== old && kstamm()[nr]) return fail(`Die Nummer ${nr} gehört schon zu ${kstamm()[nr].name}.`);
    const st = { ...kstamm() }, e = old ? st[old] : null;
    if (old && old !== nr) delete st[old];
    const alt = e ? [...new Set([...(e.alt || []), ...(normName(e.name) !== normName(name) ? [e.name] : [])])] : (f.dataset.from && normName(f.dataset.from) !== normName(name) ? [f.dataset.from] : []);
    st[nr] = { nr, name, alt: alt.filter(a => normName(a) !== normName(name)), at: Date.now() };
    S.settings.kstamm = st; saveSettings();
    // Einsätze mit geänderter Nummer mitziehen
    if (old && old !== nr) for (const mk in S.months) { let ch = false; for (const dd in S.months[mk].days) for (const k of S.months[mk].days[dd].kunden || []) if (k.nr === old) { k.nr = nr; ch = true; } if (ch) { S.months[mk].updatedAt = Date.now(); scheduleRemote("m-" + mk); } }
    const n = assignNumbers(); saveLocal();
    toast(`${nr} · ${name} gespeichert${n ? ` · ${n} alte ${n === 1 ? "Eintrag" : "Einträge"} zugeordnet` : ""}`); openKstamm(); render();
  } else if (f.id === "ksp-form") {
    const { out, bad } = parseKundenListe($("ksp-text").value), err = $("ksp-err");
    if (!out.length) { err.textContent = "Keine Zeile erkannt. Bitte „Nummer Name“ pro Zeile."; err.hidden = false; return; }
    const r = importKunden(out); closeSheet(); render();
    toast(`${r.neu} neu, ${r.ren} umbenannt${r.zug ? `, ${r.zug} alte Einträge zugeordnet` : ""}${bad.length ? ` · ${bad.length} Zeilen nicht erkannt` : ""}`);
  } else if (f.id === "kp-form") {
    const min = Math.round(Number($("kp-min").value));
    if (!(min >= 1 && min <= 120)) { toast("Bitte 1 bis 120 Minuten eintragen."); return; }
    if ($("kp-def").checked) { S.settings.kpMin = min; saveSettings(); }
    const ds = $("kp-date") ? $("kp-date").value : todayDs(), at = $("kp-at") ? $("kp-at").value : nowHM();
    if (!ds || !at) { toast("Bitte Datum und Uhrzeit eintragen."); return; }
    closeSheet(); addKaffee(min, ds, at);
  } else if (f.id === "partial-form") {
    const ds = $("q-date").value, from = $("q-from").value, to = $("q-to").value, errEl = $("q-err");
    if (!ds || !from || !to || toMin(to) <= toMin(from)) { errEl.textContent = "Bitte Datum, Von und Bis eintragen. Bis muss nach Von liegen."; errEl.hidden = false; return; }
    const r = clone(getRec(ds) || { kind: holidayName(ds) ? "feiertag" : "arbeit" });
    r.abs = (r.abs || []).concat({ type: $("q-type").value, from, to });
    if ($("q-beleg").checked) r.beleg = true;
    setRec(ds, r); closeSheet();
    toast(`${PARTIAL[r.abs[r.abs.length - 1].type].label} ${from}–${to} eingetragen.`); render();
  } else if (f.id === "abs-form") {
    const kind = $("a-kind").value, from = $("a-from").value, to = $("a-to").value, errEl = $("a-err");
    if (!from || !to || to < from) { errEl.textContent = "Bitte ein gültiges Datum wählen. Bis darf nicht vor Von liegen."; errEl.hidden = false; return; }
    let n = 0, ds = from, guard = 0;
    while (ds <= to && guard++ < 400) {
      if (sollBase(ds) > 0) {
        const r = clone(getRec(ds) || {});
        r.kind = kind;
        if ($("a-beleg").checked) r.beleg = true;
        const note = $("a-note").value.trim();
        if (note) r.note = r.note && !r.note.includes(note) ? r.note + " · " + note : note;
        setRec(ds, r); n++;
      }
      ds = addDays(ds, 1);
    }
    if (!n) { errEl.textContent = "Im gewählten Zeitraum liegt kein Arbeitstag."; errEl.hidden = false; return; }
    toast(`${KINDS[kind].label} für ${n} Arbeitstag${n === 1 ? "" : "e"} eingetragen.`); render();
  } else if (f.id === "prof-form") {
    const s = S.settings, errEl = $("p-err");
    const saldoTxt = $("p-saldo").value.trim().replace("−", "-");
    let saldo = 0;
    if (saldoTxt) {
      const m = saldoTxt.match(/^(-?)(\d{1,4})(?::(\d{1,2}))?$/) || saldoTxt.match(/^(-?)(\d+)[,.](\d+)$/);
      if (!m) { errEl.textContent = "Zeitkonto-Übertrag bitte als Std:Min eingeben, z. B. 4:30 oder -2:15."; errEl.hidden = false; return; }
      saldo = saldoTxt.includes(":") || !/[,.]/.test(saldoTxt) ? (Number(m[2]) * 60 + Number(m[3] || 0)) : Math.round(parseFloat(m[2] + "." + m[3]) * 60);
      if (m[1]) saldo = -saldo;
    }
    s.name = $("p-name").value.trim(); s.persnr = $("p-persnr").value.trim(); s.firma = $("p-firma").value.trim();
    s.soll = [0, 1, 2, 3, 4, 5, 6].map(i => toMin($("p-soll" + i).value) || 0);
    s.modell = $("p-modell").value;
    s.erfassung = $("p-erf").value;
    s.zeigen = Object.fromEntries(Object.keys(FUNKTIONEN).map(k => [k, $("p-fn-" + k).checked]));
    if (s.modell === "woche") {
      const wTxt = $("p-wstd").value.trim(), wm = wTxt.match(/^(\d{1,3})(?::(\d{1,2}))?$/) || wTxt.match(/^(\d{1,3})[,.](\d{1,2})$/);
      if (!wm) { errEl.textContent = "Stunden pro Woche bitte als Zahl eingeben, z. B. 30 oder 38,5."; errEl.hidden = false; return; }
      const wMin = wTxt.includes(":") ? Number(wm[1]) * 60 + Number(wm[2] || 0) : Math.round(parseFloat(wm[1] + "." + (wm[2] || 0)) * 60);
      const tage = [0, 1, 2, 3, 4, 5, 6].map(i => $("p-wt" + i).checked ? 1 : 0);
      if (!tage.some(Boolean)) { errEl.textContent = "Bitte mindestens einen Arbeitstag auswählen."; errEl.hidden = false; return; }
      if (wMin > 80 * 60) { errEl.textContent = "Mehr als 80 Stunden pro Woche sind nicht möglich."; errEl.hidden = false; return; }
      s.wochenMin = wMin; s.wochenTage = tage;
    }
    s.urlaubTage = Number($("p-urlaub").value) || 0; s.urlaubRest = Number($("p-rest").value) || 0;
    s.startSaldo = saldo; s.startDate = $("p-start").value || s.startDate; s.region = $("p-region").value; s.pauseHinweis = $("p-pause").checked;
    s.kpMin = Math.max(1, Math.min(120, Math.round(Number($("p-kp").value) || 10))); s.kpAbzug = $("p-kpab").checked;
    saveSettings(); toast("Profil gespeichert."); render();
  }
});

$("import-file").addEventListener("change", e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => importText(fr.result);
  fr.readAsText(file);
});
window.__onImport = () => { const t = window.AndroidBridge && AndroidBridge.getImported(); if (t) importText(t); };
window.__onBack = () => {
  if (!$("print-root").hidden) { closeNachweis(); return; }
  if ($("sheet-root").innerHTML) { closeSheet(); return; }
  if (tab !== "heute") { tab = "heute"; render(); window.scrollTo(0, 0); return; }
  if (window.AndroidBridge) AndroidBridge.exit();
};
function importText(text) {
    try {
      const p = JSON.parse(text);
      if (!p || p.app !== "stempeluhr" || typeof p.months !== "object") throw new Error("format");
      const now = Date.now();
      S.settings = { ...defaultSettings(), ...(p.settings || {}), updatedAt: now };
      for (const mk in p.months) S.months[mk] = { days: p.months[mk].days || {}, updatedAt: now };
      saveLocal(); scheduleRemote("settings"); for (const mk in S.months) scheduleRemote("m-" + mk);
      toast("Sicherung eingespielt."); render();
    } catch (x) { toast("Diese Datei ist keine Stempeluhr-Sicherung."); }
}

/* ---------- Takt ---------- */
let lastMinute = -1, lastDay = todayDs();
setInterval(() => {
  const d = new Date();
  const c = $("clock");
  if (c) c.innerHTML = `${pad(d.getHours())}:${pad(d.getMinutes())}<span class="sec">${pad(d.getSeconds())}</span>`;
  if (d.getMinutes() !== lastMinute) {
    lastMinute = d.getMinutes();
    if (todayDs() !== lastDay) { lastDay = todayDs(); viewMonth = lastDay.slice(0, 7); viewYear = +lastDay.slice(0, 4); closeMonths(); }
    if (!$("sheet-root").innerHTML && (tab === "heute" || tab === "monat") && !["m-rate", "m-basis"].includes((document.activeElement || {}).id)) render();
  }
}, 1000);

if (!S.settings.startDate) S.settings.startDate = todayDs();
saveLocal();
setSync("pending");
// In der Cloud-Version erst nach dem Abgleich abschließen, damit kein älterer Stand neuere Daten überschreibt
let closedOnce = false;
assignNumbers();
if (window.AndroidBridge || window.STEMPELUHR_OFFLINE || !(window.claude && window.claude.use)) { closedOnce = true; closeMonths(); }
render();
connect();
})();
</script>
