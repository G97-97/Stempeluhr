<style>
/* Layout: one-screen phone app, scrolling content, fixed bottom tab bar, bottom sheets for editing */
:root {
  --bg: #F2F4F1;
  --surface: #FFFFFF;
  --surface-2: #E8ECE7;
  --ink: #15201B;
  --muted: #5B6862;
  --line: #D4DAD3;
  --accent: #0E6B57;
  --accent-ink: #FFFFFF;
  --accent-soft: #D6EBE3;
  --break: #A86200;
  --break-soft: #F6E6C9;
  --danger: #B3261E;
  --danger-soft: #F8DEDA;
  --blue: #2B5BA6;
  --blue-soft: #DCE6F6;
  --violet: #6A4BA8;
  --violet-soft: #E7E0F5;
  --shadow: 0 1px 2px rgba(20,32,27,.06), 0 6px 20px rgba(20,32,27,.06);
  --f-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1412; --surface: #172019; --surface-2: #212C27; --ink: #E6ECE8; --muted: #9AA7A0; --line: #2D3934;
    --accent: #4FC3A1; --accent-ink: #062219; --accent-soft: #163A30;
    --break: #E9A949; --break-soft: #3A2B12; --danger: #F2877E; --danger-soft: #3E1D1A;
    --blue: #8DB2F0; --blue-soft: #1D2C45; --violet: #B9A2EC; --violet-soft: #2C2343;
    --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1412; --surface: #172019; --surface-2: #212C27; --ink: #E6ECE8; --muted: #9AA7A0; --line: #2D3934;
  --accent: #4FC3A1; --accent-ink: #062219; --accent-soft: #163A30;
  --break: #E9A949; --break-soft: #3A2B12; --danger: #F2877E; --danger-soft: #3E1D1A;
  --blue: #8DB2F0; --blue-soft: #1D2C45; --violet: #B9A2EC; --violet-soft: #2C2343;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

.app { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 4px 14px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.brand h1 { font-size: 17px; margin: 0; letter-spacing: .01em; }
.brand small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sync { font-size: 11.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync.cloud i { background: var(--accent); }
.sync.local i { background: var(--break); }
.sync.device i { background: var(--accent); }

.view { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

/* Heute */
.clock-card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px 16px 16px; box-shadow: var(--shadow); display: grid; gap: 14px; }
.clock-date { color: var(--muted); font-size: 14px; }
.clock { font-family: var(--f-num); font-size: clamp(44px, 15vw, 64px); font-weight: 600; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.clock .sec { font-size: .45em; color: var(--muted); margin-left: 4px; }
.status { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; font-weight: 600; font-size: 14px; width: fit-content; background: var(--surface-2); color: var(--muted); }
.status i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.status.work { background: var(--accent-soft); color: var(--accent); }
.status.work i { animation: pulse 1.6s ease-in-out infinite; }
.status.pause { background: var(--break-soft); color: var(--break); }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .status.work i { animation: none; } }
.big-btn { width: 100%; min-height: 72px; border: 0; border-radius: 16px; font-size: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 12px; background: var(--accent); color: var(--accent-ink); transition: transform .08s; }
.big-btn:active { transform: scale(.985); }
.big-btn.pause { background: var(--break); color: var(--surface); }
.big-btn.end { background: var(--ink); color: var(--bg); }
.big-btn.done { background: var(--surface-2); color: var(--muted); font-size: 16px; font-weight: 600; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 14px; font-weight: 600; font-size: 14.5px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.grow { flex: 1 1 0; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn svg, .big-btn svg { flex: none; }

.stamps { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; }
.stamp { border: 1px solid var(--line); border-radius: 12px; padding: 9px 6px; text-align: center; background: var(--bg); }
.stamp span { display: block; font-size: 11px; hyphens: auto; overflow-wrap: anywhere; color: var(--muted); line-height: 1.2; min-height: 2.4em; }
.stamp b { display: block; font-family: var(--f-num); font-size: 17px; font-weight: 600; margin-top: 2px; }
.stamp.set { border-color: var(--accent); background: var(--accent-soft); }
.stamp.set span { color: var(--accent); }
.stamp.next { border-style: dashed; border-color: var(--ink); }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; min-width: 0; }
.tile span { display: block; font-size: 12px; color: var(--muted); }
.tile b { display: block; font-family: var(--f-num); font-size: 22px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.tile small { color: var(--muted); font-size: 12px; }
.pos { color: var(--accent); }
.neg { color: var(--danger); }

.note { border-radius: 12px; padding: 10px 12px; font-size: 13.5px; background: var(--break-soft); color: var(--ink); border: 1px solid var(--break); }
.note.info { background: var(--blue-soft); border-color: var(--blue); }
.hint { font-size: 13px; color: var(--muted); margin: 0; }

.quick { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.quick button { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 6px; display: grid; justify-items: center; gap: 6px; font-size: 13px; font-weight: 600; min-height: 76px; }
.quick button svg { color: var(--accent); }

/* Chips */
.chip { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.chip.k-work { background: var(--accent-soft); color: var(--accent); }
.chip.k-blue { background: var(--blue-soft); color: var(--blue); }
.chip.k-red { background: var(--danger-soft); color: var(--danger); }
.chip.k-violet { background: var(--violet-soft); color: var(--violet); }
.chip.k-warn { background: var(--break-soft); color: var(--break); }

/* Monat */
.month-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.month-nav h2 { margin: 0; font-size: 20px; text-transform: none; letter-spacing: 0; color: var(--ink); }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.days { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.day { display: grid; grid-template-columns: 46px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.day:last-child { border-bottom: 0; }
.day.weekend { background: var(--bg); }
.day.today { box-shadow: inset 3px 0 0 var(--accent); }
.day .d { font-weight: 700; line-height: 1.1; }
.day .d small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.day .mid { min-width: 0; display: grid; gap: 3px; }
.day .times { font-family: var(--f-num); font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.day .tags { display: flex; gap: 4px; flex-wrap: wrap; }
.day .right { text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.day .right b { display: block; font-size: 15px; }
.day .right small { font-size: 12px; }
.future { opacity: .62; }

/* Forms */
.field { display: grid; gap: 5px; }
.field label, .lbl { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; min-height: 46px; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 12px; font-size: 16px; }
.field textarea { min-height: 70px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.grid4 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.field input, .field select { min-width: 0; }
.week-soll { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 4px; }
.week-soll .field input { padding: 8px 2px; font-size: 13px; text-align: center; min-height: 42px; }
.week-soll .field label { text-align: center; }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 500; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.form { display: grid; gap: 12px; }
.err { color: var(--danger); font-size: 13.5px; font-weight: 600; }
.abs-row { display: grid; grid-template-columns: minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) 40px; gap: 6px; align-items: end; }
.abs-row .field select, .abs-row .field input { padding: 8px 6px; font-size: 14px; }
.abs-row .icon-btn { width: 40px; height: 46px; }
.earn-out { display: grid; gap: 2px; margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--bg); }
.earn-out span { color: var(--muted); font-size: 13.5px; }
.earn-out b { font-size: 26px; letter-spacing: -.01em; }
.earn-out small { color: var(--muted); font-size: 12.5px; }
.closed-badge { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--accent); margin: -4px 0 10px; }
.closed-badge svg { width: 16px; height: 16px; }
.closed-card { border-color: var(--accent); }
.ytbl { display: grid; }
.ytr { display: grid; grid-template-columns: minmax(0,1.4fr) 0.6fr 1fr 1fr; gap: 6px; align-items: center; padding: 10px 2px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; font: inherit; color: inherit; width: 100%; }
.ytr:last-child { border-bottom: 0; }
.ytr span:not(:first-child) { text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.ytr .ok svg { width: 14px; height: 14px; color: var(--accent); vertical-align: -2px; }
.yth { font-size: 12px; font-weight: 600; color: var(--muted); padding-top: 0; }
.kp-row { display: flex; gap: 8px; margin-top: 10px; }
.kp-btn { background: var(--break-soft); border-color: var(--break); }
.kp-erow { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) 44px; gap: 8px; align-items: end; }
.kp-erow .icon-btn { width: 44px; height: 46px; }
.kd-tbl { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); }
.kd-cap { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 8px 8px 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
.kd-cap b { font-size: 14px; }
.kd-cap small { color: var(--muted); font-size: 12.5px; font-weight: 500; margin-left: 6px; }
.kd-plus { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; font-size: 26px; line-height: 1; display: grid; place-items: center; font-weight: 500; }
.kd-tr { display: grid; grid-template-columns: minmax(0,1fr) 72px 72px 32px; gap: 4px; align-items: center; padding: 5px 6px; border-bottom: 1px solid var(--line); }
.kd-tr:last-child { border-bottom: 0; }
.kd-th { font-size: 12px; font-weight: 600; color: var(--muted); padding-top: 6px; padding-bottom: 6px; }
.kd-th span { padding-left: 4px; }
.kd-tr input { width: 100%; min-width: 0; min-height: 42px; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 6px 6px; font-size: 15px; }
.kd-tr input[type=time] { padding: 6px 2px; text-align: center; }
.kd-tr input[type=time]::-webkit-calendar-picker-indicator { display: none; }

<script>
(() => {
"use strict";

/* ---------- Stammdaten ---------- */
const KINDS = {

  behoerde:   { label: "Behördenweg", paid: true },
  verh:       { label: "Sonst. Dienstverhinderung", paid: true },
  dienstgang: { label: "Dienstgang / Außentermin", paid: true },

};
const ORTE = { betrieb: "Betrieb", homeoffice: "Homeoffice", dienstreise: "Dienstreise", aussendienst: "Außendienst / Baustelle", kunde: "Beim Kunden" };
const WD = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
const WD_LONG = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
const MONTHS = ["Jänner", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];

const STAMP_SHORT = { in: "Arbeits&shy;beginn", ls: "Mittag Anfang", le: "Mittag Ende", out: "Arbeits&shy;ende" };
const STAMP_LABELS = { in: "Arbeitsbeginn", ls: "Mittag Anfang", le: "Mittag Ende", out: "Arbeitsende" };

/* ---------- Helfer ---------- */
const pad = n => String(n).padStart(2, "0");
const dsOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDs = ds => { const [y, m, d] = ds.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (ds, n) => { const d = parseDs(ds); d.setDate(d.getDate() + n); return dsOf(d); };

const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };

const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const hm = m => { const s = m < 0 ? "−" : ""; m = Math.abs(Math.round(m)); return `${s}${Math.floor(m / 60)}:${pad(m % 60)}`; };

const dec2 = v => v.toFixed(2).replace(".", ",");

const monthName = (mk, region) => { const [y, m] = mk.split("-").map(Number); return `${(region === "DE" ? MONTHS_DE : MONTHS)[m - 1]} ${y}`; };
const daysInMonth = mk => { const [y, m] = mk.split("-").map(Number); return new Date(y, m, 0).getDate(); };
const clone = o => JSON.parse(JSON.stringify(o));
const $ = id => document.getElementById(id);

/* ---------- Feiertage ---------- */
function easter(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
    g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4,

const holCache = {};

  if (holCache[key]) return holCache[key];
  const E = easter(y), map = {};
  const fix = (md, n) => map[`${y}-${md}`] = n, rel = (off, n) => map[addDays(E, off)] = n;
  if (region === "AT") {

    rel(39, "Christi Himmelfahrt"); rel(50, "Pfingstmontag"); rel(60, "Fronleichnam"); fix("08-15", "Mariä Himmelfahrt");
    fix("10-26", "Nationalfeiertag"); fix("11-01", "Allerheiligen"); fix("12-08", "Mariä Empfängnis");
    fix("12-25", "Christtag"); fix("12-26", "Stefanitag");
  } else if (region === "DE") {
    fix("01-01", "Neujahr"); rel(-2, "Karfreitag"); rel(1, "Ostermontag"); fix("05-01", "Tag der Arbeit");
    rel(39, "Christi Himmelfahrt"); rel(50, "Pfingstmontag"); fix("10-03", "Tag der Deutschen Einheit");
    fix("12-25", "1. Weihnachtstag"); fix("12-26", "2. Weihnachtstag");

const holidayName = ds => holidays(+ds.slice(0, 4), S.settings.region)[ds] || null;

/* ---------- Zustand & Speicherung ---------- */
const LS_KEY = "stempeluhr.v1";
const defaultSettings = () => ({
  name: "", persnr: "", firma: "", region: "AT",
  soll: [480, 480, 480, 480, 390, 0, 0], // Mo..So in Minuten
  urlaubTage: 25, urlaubRest: 0, startSaldo: 0, startDate: todayDs(), pauseHinweis: true, kpMin: 10, kpAbzug: true, updatedAt: 0,

try {
  const raw = localStorage.getItem(LS_KEY);
  if (raw) { const p = JSON.parse(raw); S.settings = { ...defaultSettings(), ...(p.settings || {}) }; S.months = p.months || {}; }
} catch (e) { /* kein lokaler Speicher */ }

function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} }

let dbCol = null, syncMode = "pending";
const pending = new Set();
let flushTimer = null, writing = false;
function scheduleRemote(id) { pending.add(id); clearTimeout(flushTimer); flushTimer = setTimeout(flush, 600); }
async function flush() {
  if (!dbCol || writing) return;

  try {
    while (pending.size) {

      const body = id === "settings" ? clone(S.settings) : clone(S.months[id.slice(2)] || { days: {}, updatedAt: Date.now() });

        break;
      }
    }
  } finally { writing = false; }
}

function getRec(ds) { const m = S.months[ds.slice(0, 7)]; return m && m.days[ds.slice(8)] || null; }
function setRec(ds, rec) {
  const mk = ds.slice(0, 7);
  if (!S.months[mk]) S.months[mk] = { days: {}, updatedAt: 0 };
  if (rec) S.months[mk].days[ds.slice(8)] = rec; else delete S.months[mk].days[ds.slice(8)];
  refreshClosed(mk);
  S.months[mk].updatedAt = Date.now();
  saveLocal(); scheduleRemote("m-" + mk);
}
function saveSettings() { S.settings.updatedAt = Date.now(); saveLocal(); scheduleRemote("settings"); }

/* ---------- Monatsabschluss ---------- */
// Am Monatsersten wird der Vormonat abgeschlossen: die Ergebnisse werden als fester Stand im Monat gespeichert.
// Die Tageseinträge bleiben erhalten; wird danach noch etwas geändert, wird der Stand aktualisiert und markiert.
function monthSnapshot(mk) {
  const t = monthStats(mk), e = earn(t);
  return { soll: t.soll, ist: t.ist, saldo: t.saldo, worked: t.worked, workdays: t.workdays, urlaub: t.urlaub, krank: t.krank, arzt: t.arzt, km: t.km,
    konto: totalSaldo(lastDayOf(mk)), kunden: customerStats(mk), verdienst: e.rate ? { basis: e.basis, rate: e.rate, sum: e.sum } : null };
}
function closeMonths() {
  const cur = todayDs().slice(0, 7); let last = null;
  for (const mk of allMonthKeys()) {
    if (mk >= cur) continue;

    if (!m || !Object.keys(m.days || {}).length) { if (mk >= S.settings.startDate.slice(0, 7) && monthStats(mk).soll === 0) continue; }

  }

}
function refreshClosed(mk) {
  const m = S.months[mk];
  if (m && m.closed) m.closed = { ...m.closed, ...monthSnapshot(mk), changedAt: Date.now() };
}

function setSync(mode) {
  syncMode = mode;
  const el = $("sync");
  el.className = "sync " + mode;
  el.querySelector("span").textContent = mode === "cloud" ? "In deinem Konto gesichert" : mode === "device" ? "Auf diesem Handy gespeichert" : mode === "local" ? "Nur auf diesem Gerät" : "Verbinde …";
}

async function connect() {
  if (window.AndroidBridge || window.STEMPELUHR_OFFLINE) { setSync("device"); try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {} return render(); }

  while (!(window.claude && window.claude.use) && tries < 10) { await new Promise(r => setTimeout(r, 300)); tries++; }
  if (!(window.claude && window.claude.use)) return setSync("local");

    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return setSync("local");
    const uid = await user.id();
    if (!uid) return setSync("local");
    dbCol = db.collection("data/users/" + uid);
    let pushed = false;
    dbCol.onSnapshot(snap => {
      let changed = false;
      const remote = new Map();
      for (const d of snap.docs) {
        const data = d.data() || {};
        remote.set(d.id, data.updatedAt || 0);
        if (d.id === "settings") {
          if ((data.updatedAt || 0) > (S.settings.updatedAt || 0)) { S.settings = { ...defaultSettings(), ...clone(data) }; changed = true; }
        } else if (d.id.startsWith("m-")) {
          const mk = d.id.slice(2), loc = S.months[mk];
          if (!loc || (data.updatedAt || 0) > (loc.updatedAt || 0)) { S.months[mk] = { days: clone(data.days || {}), updatedAt: data.updatedAt || 0 }; changed = true; }

      if (!pushed && !snap.metadata.fromCache) {
        pushed = true;
        for (const mk in S.months) if ((S.months[mk].updatedAt || 0) > (remote.has("m-" + mk) ? remote.get("m-" + mk) : -1)) scheduleRemote("m-" + mk);

      if (changed) { saveLocal(); render(); }

}

/* ---------- Kunden ---------- */
const kdDur = k => (k.from && k.to) ? ((toMin(k.to) - toMin(k.from)) + 1440) % 1440 : 0;

function knownCustomers() {
  const m = new Map();
  for (const mk in S.months) for (const dd in S.months[mk].days) for (const k of S.months[mk].days[dd].kunden || []) if (k.name) m.set(k.name, (m.get(k.name) || 0) + 1);
  return [...m.entries()].sort((a, b) => b[1] - a[1]).map(x => x[0]);
}

  const m = new Map();
  for (const ds of monthDays(mk)) {
    const r = getRec(ds);
    for (const k of (r && r.kunden) || []) { const e = m.get(k.name) || { name: k.name, min: 0, n: 0 }; e.min += kdMin(k, ds); e.n++; m.set(k.name, e); }
  }

}
const kdDatalist = () => `<datalist id="kd-list">${knownCustomers().map(n => `<option value="${esc(n)}"></option>`).join("")}</datalist>`;

const eur = v => v.toLocaleString("de-AT", { style: "currency", currency: "EUR" });
const EARN_BASIS = { worked: "Gearbeitet", ist: "Mit Urlaub/Krank", ueber: "Überstunden", krank: "Krankenstand" };
const EARN_HINT = { worked: "gestempelte Arbeitszeit", ist: "Ist-Stunden inkl. Urlaub, Krankenstand, Feiertag", ueber: "Überstunden = Ist minus Soll im Monat", krank: "Stunden der Krankenstandstage" };
const earnBasis = () => EARN_BASIS[S.settings.rateBasis] ? S.settings.rateBasis : "worked";
// eigener Stundensatz je Auswahl (z. B. Überstunden mit Zuschlag); alter Einzelwert gilt als Vorgabe
const rateStr = b => { const r = S.settings.rates || {}; return r[b] != null ? r[b] : (S.settings.rate || ""); };

function earn(t) {
  const basis = earnBasis(), rate = rateNum(basis);
  const min = Math.max(0, { worked: t.worked, ist: t.ist, ueber: t.saldo, krank: t.krankMin }[basis]);
  return { basis, min, rate, sum: Math.round(min / 60 * rate * 100) / 100 };
}
const earnLine = e => `${EARN_BASIS[e.basis]} ${dec(e.min)} h × ${eur(e.rate)} = ${eur(e.sum)}`;
const kpDefault = () => Math.max(1, Math.min(120, Math.round(Number(S.settings.kpMin) || 10)));
const kpSum = r => (r.kp || []).reduce((a, k) => a + (Number(k.min) || 0), 0);
/* ---------- Berechnung ---------- */
function sollBase(ds) {
  if (holidayName(ds)) return 0;
  const wd = (parseDs(ds).getDay() + 6) % 7;
  return S.settings.soll[wd] || 0;
}
function overlap(a1, a2, b1, b2) { return Math.max(0, Math.min(a2, b2) - Math.max(a1, b1)); }

function calc(ds, rec) {
  rec = rec || getRec(ds);
  const hol = holidayName(ds);
  const kind = rec && rec.kind || (hol ? "feiertag" : "arbeit");
  const K = KINDS[kind] || KINDS.arbeit;
  let soll = sollBase(ds);
  if (K.credit === "nosoll") soll = 0;
  const today = todayDs(), isToday = ds === today;
  const nm = isToday ? nowMin() : null;
  const r = rec || {};
  let iv = [], incomplete = false, brk = 0, state = "off";
  const tIn = toMin(r.in);
  if (tIn != null) {
    const fix = t => (t != null && t < tIn ? t + 1440 : t);
    const ls = fix(toMin(r.ls)), le = fix(toMin(r.le));
    let out = fix(toMin(r.out));

      if (le != null) { brk = le - ls; if (end != null) iv.push([le, Math.max(le, end)]); }

/* ---------- Ansicht: Abwesenheit ---------- */
function absenceGroups(year) {
  const items = [];
  for (const mk of Object.keys(S.months).sort()) {
    if (!mk.startsWith(year + "-")) continue;
    for (const dd of Object.keys(S.months[mk].days).sort()) {
      const rec = S.months[mk].days[dd];
      if (rec.kind && rec.kind !== "arbeit") items.push({ ds: `${mk}-${dd}`, kind: rec.kind });
    }
  }
  const groups = [];
  for (const it of items) {
    const g = groups[groups.length - 1];
    if (g && g.kind === it.kind && dayGapFree(g.to, it.ds)) { g.to = it.ds; g.days.push(it.ds); }
    else groups.push({ kind: it.kind, from: it.ds, to: it.ds, days: [it.ds] });
  }
  return groups.reverse();
}

async function offerFile(filename, data) {

  if (window.STEMPELUHR_OFFLINE) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], { type: filename.endsWith(".csv") ? "text/csv;charset=utf-8" : "application/json" }));
    a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    toast("Datei wird in Downloads gespeichert."); return;
  }
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) {}
  if (dl) {
    try { await dl.save({ filename, data }); toast("Datei gespeichert."); return; }

    case "clearday-yes": setRec(el.dataset.ds, null); closeSheet(); toast("Eintrag gelöscht."); render(); break;
    case "mprev": case "mnext": { const [y, m] = viewMonth.split("-").map(Number); const d = new Date(y, m - 1 + (act === "mnext" ? 1 : -1), 1); viewMonth = dsOf(d).slice(0, 7); render(); break; }
    case "csv": { const n = (S.settings.name || "").replace(/[^\wÄÖÜäöüß -]/g, "").trim().replace(/\s+/g, "_"); await offerFile(`Arbeitszeit_${n ? n + "_" : ""}${viewMonth}.csv`, buildCsv(viewMonth)); break; }
    case "report": showText(`Bericht ${monthName(viewMonth, S.settings.region)}`, buildReport(viewMonth), "Zum Weiterleiten per E-Mail oder Messenger."); break;
    case "copyout": {
      const ta = $("out-text");
      if (window.AndroidBridge) { AndroidBridge.copy(ta.value); toast("In die Zwischenablage kopiert."); break; }
      try { await navigator.clipboard.writeText(ta.value); toast("In die Zwischenablage kopiert."); }
      catch (x) { ta.focus(); ta.select(); toast("Text markiert. Jetzt kopieren."); }
      break;
    }
    case "delgroup": {
      const days = el.dataset.days.split(",");
      openSheet(`<h3>Abwesenheit löschen?</h3><p class="sub">${fmtShort(days[0])}${days.length > 1 ? " – " + fmtShort(days[days.length - 1]) : ""} wird wieder als normaler Arbeitstag geführt.</p>
        <div class="sheet-actions"><button class="btn danger grow" data-act="delgroup-yes" data-days="${days.join(",")}">Löschen</button><button class="btn grow" data-act="closesheet-btn">Abbrechen</button></div>`);
      break;
    }
    case "delgroup-yes": {
      for (const ds of el.dataset.days.split(",")) { const r = getRec(ds); if (!r) continue; const n = clone(r); n.kind = "arbeit"; delete n.beleg; setRec(ds, isEmptyRec(cleanRec(n), ds) ? null : cleanRec(n)); }
      closeSheet(); toast("Abwesenheit gelöscht."); render(); break;
    }
    case "backup": await offerFile(`Stempeluhr_Sicherung_${todayDs()}.json`, JSON.stringify({ app: "stempeluhr", version: 1, exportedAt: new Date().toISOString(), ...S }, null, 1)); break;
    case "import": if (window.AndroidBridge) { AndroidBridge.openFile(); break; } $("import-file").value = ""; $("import-file").click(); break;
    case "wipe":
      openSheet(`<h3>Wirklich alle Daten löschen?</h3><p class="sub">Das kann nicht rückgängig gemacht werden. Lade vorher eine Sicherung herunter, wenn du die Zeiten noch brauchst.</p>
        <div class="sheet-actions"><button class="btn danger grow" data-act="wipe-yes">Endgültig löschen</button><button class="btn grow" data-act="closesheet-btn">Abbrechen</button></div>`);
      break;
    case "wipe-yes": {
      const now = Date.now();
      for (const mk in S.months) { S.months[mk] = { days: {}, updatedAt: now }; scheduleRemote("m-" + mk); }
      S.settings = { ...defaultSettings(), updatedAt: now }; saveLocal(); scheduleRemote("settings");
      closeSheet(); toast("Alle Daten gelöscht."); render(); break;
    }
  }
});

document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "edit-form") {
    readDraftInputs();
    const r = cleanRec(draft.rec), err = validateRec(r);
    if (err) { renderEditor(err); return; }
    const ds = draft.ds;
    setRec(ds, isEmptyRec(r, ds) ? null : r);
    closeSheet(); toast("Gespeichert."); render();
  } else if (f.id === "kd-form") {
    const mode = f.dataset.mode, ds = $("k-date").value, name = $("k-name").value.trim(), from = $("k-from").value, to = mode === "add" ? $("k-to").value : "", errEl = $("k-err");
    const fail = m => { errEl.textContent = m; errEl.hidden = false; };
    if (!name) return fail("Bitte den Namen des Kunden eintragen.");
    if (!ds || !from) return fail("Bitte Datum und Von-Zeit eintragen.");
    if (mode === "add" && (!to || to === from)) return fail("Bitte eine Bis-Zeit eintragen, die sich von der Von-Zeit unterscheidet.");
    const r = clone(getRec(ds) || { kind: holidayName(ds) ? "feiertag" : "arbeit" });
    const k = { name, from }; if (to) k.to = to; const note = $("k-note").value.trim(); if (note) k.note = note;
    r.kunden = (r.kunden || []).concat(k).sort((a, b) => a.from.localeCompare(b.from));
    lastUndo = { ds, prev: getRec(ds) ? clone(getRec(ds)) : null };
    setRec(ds, r); closeSheet();
    toast(mode === "start" ? `${name} ab ${from} gestartet` : `${name} ${from}–${to} eingetragen`, true); render();
  } else if (f.id === "kp-form") {
    const min = Math.round(Number($("kp-min").value));
    if (!(min >= 1 && min <= 120)) { toast("Bitte 1 bis 120 Minuten eintragen."); return; }
    if ($("kp-def").checked) { S.settings.kpMin = min; saveSettings(); }
    closeSheet(); addKaffee(min);
  } else if (f.id === "partial-form") {
    const ds = $("q-date").value, from = $("q-from").value, to = $("q-to").value, errEl = $("q-err");
    if (!ds || !from || !to || toMin(to) <= toMin(from)) { errEl.textContent = "Bitte Datum, Von und Bis eintragen. Bis muss nach Von liegen."; errEl.hidden = false; return; }
    const r = clone(getRec(ds) || { kind: holidayName(ds) ? "feiertag" : "arbeit" });
    r.abs = (r.abs || []).concat({ type: $("q-type").value, from, to });
    if ($("q-beleg").checked) r.beleg = true;
    setRec(ds, r); closeSheet();
    toast(`${PARTIAL[r.abs[r.abs.length - 1].type].label} ${from}–${to} eingetragen.`); render();
  } else if (f.id === "abs-form") {
    const kind = $("a-kind").value, from = $("a-from").value, to = $("a-to").value, errEl = $("a-err");
    if (!from || !to || to < from) { errEl.textContent = "Bitte ein gültiges Datum wählen. Bis darf nicht vor Von liegen."; errEl.hidden = false; return; }
    let n = 0, ds = from, guard = 0;
    while (ds <= to && guard++ < 400) {
      if (sollBase(ds) > 0) {
        const r = clone(getRec(ds) || {});
        r.kind = kind;
        if ($("a-beleg").checked) r.beleg = true;
        const note = $("a-note").value.trim();
        if (note) r.note = r.note && !r.note.includes(note) ? r.note + " · " + note : note;
        setRec(ds, r); n++;
      }
      ds = addDays(ds, 1);
    }
    if (!n) { errEl.textContent = "Im gewählten Zeitraum liegt kein Arbeitstag."; errEl.hidden = false; return; }
    toast(`${KINDS[kind].label} für ${n} Arbeitstag${n === 1 ? "" : "e"} eingetragen.`); render();
  } else if (f.id === "prof-form") {
    const s = S.settings, errEl = $("p-err");
    const saldoTxt = $("p-saldo").value.trim().replace("−", "-");
    let saldo = 0;
    if (saldoTxt) {
      const m = saldoTxt.match(/^(-?)(\d{1,4})(?::(\d{1,2}))?$/) || saldoTxt.match(/^(-?)(\d+)[,.](\d+)$/);
      if (!m) { errEl.textContent = "Zeitkonto-Übertrag bitte als Std:Min eingeben, z. B. 4:30 oder -2:15."; errEl.hidden = false; return; }
      saldo = saldoTxt.includes(":") || !/[,.]/.test(saldoTxt) ? (Number(m[2]) * 60 + Number(m[3] || 0)) : Math.round(parseFloat(m[2] + "." + m[3]) * 60);
      if (m[1]) saldo = -saldo;
    }
    s.name = $("p-name").value.trim(); s.persnr = $("p-persnr").value.trim(); s.firma = $("p-firma").value.trim();
    s.soll = [0, 1, 2, 3, 4, 5, 6].map(i => toMin($("p-soll" + i).value) || 0);
    s.urlaubTage = Number($("p-urlaub").value) || 0; s.urlaubRest = Number($("p-rest").value) || 0;
    s.startSaldo = saldo; s.startDate = $("p-start").value || s.startDate; s.region = $("p-region").value; s.pauseHinweis = $("p-pause").checked;
    s.kpMin = Math.max(1, Math.min(120, Math.round(Number($("p-kp").value) || 10))); s.kpAbzug = $("p-kpab").checked;
    saveSettings(); toast("Profil gespeichert."); render();
  }
});

$("import-file").addEventListener("change", e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => importText(fr.result);
  fr.readAsText(file);
});
window.__onImport = () => { const t = window.AndroidBridge && AndroidBridge.getImported(); if (t) importText(t); };
window.__onBack = () => {
  if ($("sheet-root").innerHTML) { closeSheet(); return; }
  if (tab !== "heute") { tab = "heute"; render(); window.scrollTo(0, 0); return; }
  if (window.AndroidBridge) AndroidBridge.exit();
};
function importText(text) {
    try {
      const p = JSON.parse(text);
      if (!p || p.app !== "stempeluhr" || typeof p.months !== "object") throw new Error("format");
      const now = Date.now();
      S.settings = { ...defaultSettings(), ...(p.settings || {}), updatedAt: now };
      for (const mk in p.months) S.months[mk] = { days: p.months[mk].days || {}, updatedAt: now };
      saveLocal(); scheduleRemote("settings"); for (const mk in S.months) scheduleRemote("m-" + mk);
      toast("Sicherung eingespielt."); render();
    } catch (x) { toast("Diese Datei ist keine Stempeluhr-Sicherung."); }
}

/* ---------- Takt ---------- */
let lastMinute = -1, lastDay = todayDs();
setInterval(() => {
  const d = new Date();
  const c = $("clock");
  if (c) c.innerHTML = `${pad(d.getHours())}:${pad(d.getMinutes())}<span class="sec">${pad(d.getSeconds())}</span>`;
  if (d.getMinutes() !== lastMinute) {
    lastMinute = d.getMinutes();
    if (todayDs() !== lastDay) { lastDay = todayDs(); viewMonth = lastDay.slice(0, 7); viewYear = +lastDay.slice(0, 4); closeMonths(); }
    if (!$("sheet-root").innerHTML && (tab === "heute" || tab === "monat") && !["m-rate", "m-basis"].includes((document.activeElement || {}).id)) render();
  }
}, 1000);

if (!S.settings.startDate) S.settings.startDate = todayDs();
saveLocal();
setSync("pending");
// In der Cloud-Version erst nach dem Abgleich abschließen, damit kein älterer Stand neuere Daten überschreibt
let closedOnce = false;
if (window.AndroidBridge || window.STEMPELUHR_OFFLINE || !(window.claude && window.claude.use)) { closedOnce = true; closeMonths(); }
render();
connect();
})();
</script>

</body></html>
